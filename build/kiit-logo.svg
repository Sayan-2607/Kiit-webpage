<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="600" height="100">
  <!-- Gear Logo -->
  <g id="gear">
    <!-- Outer circle -->
    <circle cx="40" cy="50" r="35" fill="none" stroke="#1FC166" stroke-width="2"/>
    
    <!-- Gear teeth -->
    <g fill="#1FC166">
      <rect x="35" y="8" width="10" height="8"/>
      <rect x="35" y="84" width="10" height="8"/>
      <rect x="8" y="45" width="8" height="10"/>
      <rect x="84" y="45" width="8" height="10"/>
      <!-- Diagonal teeth -->
      <rect x="22" y="18" width="8" height="8" transform="rotate(45 26 22)"/>
      <rect x="58" y="76" width="8" height="8" transform="rotate(45 62 80)"/>
      <rect x="58" y="18" width="8" height="8" transform="rotate(-45 62 22)"/>
      <rect x="22" y="76" width="8" height="8" transform="rotate(-45 26 80)"/>
    </g>
    
    <!-- Inner circle -->
    <circle cx="40" cy="50" r="20" fill="#1FC166"/>
    
    <!-- K letter in white -->
    <text x="40" y="58" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">K</text>
  </g>
  
  <!-- KIIT Text -->
  <text x="95" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1FC166">KIIT</text>
  <text x="95" y="65" font-family="Arial, sans-serif" font-size="14" fill="#333">Kalinga Institute of Industrial Technology</text>
</svg>